<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Floating sparkles & confetti dashes -->
  <path d="M42 38L46 32M44 35L48 35" stroke="#222725" stroke-width="2.5" stroke-linecap="round" />
  <path d="M196 44L202 52M200 46L194 50" stroke="#222725" stroke-width="2.5" stroke-linecap="round" />
  <path d="M30 115L36 112M33 118L33 110" stroke="#222725" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="210" cy="118" r="2.5" fill="#222725" />
  <circle cx="28" cy="65" r="2" fill="#222725" />
  <circle cx="198" cy="188" r="3" fill="#222725" />
  
  <!-- Playful curved motion ticks -->
  <path d="M72 26C78 22 86 24 90 28" stroke="#222725" stroke-width="2" stroke-linecap="round" />
  <path d="M152 24C158 20 166 22 170 27" stroke="#222725" stroke-width="2" stroke-linecap="round" />

  <!-- Main Folded Newspaper (Identical to default state) -->
  <g transform="translate(48, 52)">
    <!-- Newspaper Back Page Shadow / Layer -->
    <path
      d="M16 10C16 10 74 6 128 10C136 11 140 16 142 24L146 122C146 130 140 136 132 136L20 134C12 134 6 128 6 120L10 18C10 12 14 10 16 10Z"
      stroke="#222725"
      stroke-width="2.8"
      stroke-linejoin="round"
      fill="#FFFDF9"
    />

    <!-- Newspaper Header Strip -->
    <path d="M22 28H130" stroke="#222725" stroke-width="2.5" stroke-linecap="round" />
    <path d="M22 36H90" stroke="#222725" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Newspaper Comic Panels (Grid of 4 with wavy lines) -->
    <!-- Panel 1 -->
    <rect x="22" y="44" width="48" height="36" rx="3" stroke="#222725" stroke-width="2.2" fill="#FBF7EF" />
    <!-- Doodle character in panel 1: smiling face -->
    <circle cx="42" cy="60" r="8" stroke="#222725" stroke-width="1.8" />
    <path d="M39 58C39 58 40 57 41 58" stroke="#222725" stroke-width="1.5" stroke-linecap="round" />
    <path d="M43 58C43 58 44 57 45 58" stroke="#222725" stroke-width="1.5" stroke-linecap="round" />
    <path d="M40 63C41 65 43 65 44 63" stroke="#222725" stroke-width="1.5" stroke-linecap="round" />

    <!-- Panel 2 -->
    <rect x="76" y="44" width="52" height="36" rx="3" stroke="#222725" stroke-width="2.2" fill="#FBF7EF" />
    <!-- Speech bubble in panel 2 -->
    <path
      d="M84 50H118C121 50 123 52 123 55V65C123 68 121 70 118 70H96L90 75V70H84C81 70 79 68 79 65V55C79 52 81 50 84 50Z"
      stroke="#222725"
      stroke-width="1.8"
      fill="#FFFDF9"
    />
    <path d="M86 58H116" stroke="#222725" stroke-width="1.5" stroke-linecap="round" />
    <path d="M86 63H106" stroke="#222725" stroke-width="1.5" stroke-linecap="round" />

    <!-- Panel 3 -->
    <rect x="22" y="86" width="48" height="38" rx="3" stroke="#222725" stroke-width="2.2" fill="#FBF7EF" />
    <path d="M28 96H62" stroke="#222725" stroke-width="1.5" stroke-linecap="round" />
    <path d="M28 102H54" stroke="#222725" stroke-width="1.5" stroke-linecap="round" />
    <path d="M28 108H58" stroke="#222725" stroke-width="1.5" stroke-linecap="round" />

    <!-- Panel 4 -->
    <rect x="76" y="86" width="52" height="38" rx="3" stroke="#222725" stroke-width="2.2" fill="#FBF7EF" />
    <!-- Little snoopy-like ear/character silhouette -->
    <path
      d="M92 108C92 100 102 96 108 102C114 108 116 114 114 118C110 120 98 120 92 116Z"
      stroke="#222725"
      stroke-width="1.8"
      fill="#222725"
    />
  </g>

  <!-- Circular Success Checkmark Badge (Bottom-Right) - Enlarged ~1.65x -->
  <g transform="translate(178, 170)">
    <!-- Hand-drawn Circular Badge -->
    <circle cx="0" cy="0" r="39" stroke="#222725" stroke-width="4.8" fill="#FFFDF9" />
    <!-- Bold Hand-drawn Dark Checkmark -->
    <path
      d="M-17 0L-4 13L20 -13"
      stroke="#222725"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
